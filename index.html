<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valopex Strike - Mansion Update</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #000; user-select: none; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255, 255, 255, 0.8); font-size: 24px; font-weight: bold; }
        #hud { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; text-shadow: 2px 2px 4px #000; }
        
        #shop-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95); color: white; padding: 30px; border-radius: 8px;
            border: 1px solid #444; display: none; pointer-events: auto; min-width: 300px; text-align: center;
        }
        .shop-btn { background: #2c3e50; color: white; border: none; padding: 12px 20px; cursor: pointer; margin: 10px 0; width: 100%; font-size: 18px; border-radius: 4px; transition: background 0.2s; }
        .shop-btn:hover:not(:disabled) { background: #34495e; }
        .shop-btn:disabled { background: #555 !important; cursor: not-allowed; opacity: 0.7; }
        
        #start-screen, #game-over-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; pointer-events: auto; z-index: 10;
        }
        #start-screen { background: rgba(0,0,0,0.9); color: #8a0303; }
        #game-over-screen { background: rgba(100,0,0,0.9); color: white; display: none; }
        
        #instructions { text-align: center; margin-top: 20px; color: #aaa; line-height: 1.6; }
        .dev-command { color: #f39c12; font-size: 14px; margin-top: 15px; border-top: 1px solid #333; padding-top: 10px;}
        
        /* HP・弾薬バー */
        .hud-bar-container { width: 200px; height: 10px; background: rgba(100, 100, 100, 0.5); border-radius: 5px; margin-top: 5px; }
        .hud-bar { height: 100%; border-radius: 5px; transition: width 0.1s; }
        #hp-bar { background: #e74c3c; width: 100%; }
        #ammo-bar { background: #f1c40f; width: 100%; }
        
        /* ダメージエフェクト */
        #damage-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,0,0,0) 40%, rgba(255,0,0,0.3) 100%);
            opacity: 0; transition: opacity 0.2s; pointer-events: none;
        }

        /* ランキングUI用 */
        #leaderboard-box { margin-top: 20px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; width: 320px; text-align: center; max-height: 300px; overflow-y: auto; }
        #leaderboard-box h3 { margin: 0 0 10px 0; color: #f1c40f; }
        #leaderboard-list { list-style: none; padding: 0; margin: 0; text-align: left; }
        #leaderboard-list li { display: flex; justify-content: space-between; font-size: 16px; margin-bottom: 5px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        
        /* スクロールバーの装飾 */
        #leaderboard-box::-webkit-scrollbar { width: 8px; }
        #leaderboard-box::-webkit-scrollbar-track { background: #222; border-radius: 4px; }
        #leaderboard-box::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        #leaderboard-box::-webkit-scrollbar-thumb:hover { background: #777; }
    </style>
</head>
<body>
    <div id="start-screen">
        <h1 style="font-size: 56px; margin-bottom: 10px; font-family: serif;">VALOPEX STRIKE</h1>
        <p style="font-size: 20px; color: white;">開始ボタンをクリックしてゲームスタート</p> 
        <button id="start-button" class="shop-btn" style="width: auto; padding: 15px 40px; background: #8a0303; font-family: inherit; font-weight: bold;">開始</button>
        <div id="instructions">
            移動: W A S D &nbsp;|&nbsp; 視点: マウス<br>
            ジャンプ: SPACE &nbsp;|&nbsp; ダッシュ: LEFT SHIFT<br>
            射撃: 左クリック &nbsp;|&nbsp; リロード: Rキー<br>
            ショップ: Bキー
        </div>
        <div id="sensitivity-control" style="margin-top: 20px;">
            <label for="sensitivity-slider" style="color: #ccc;">感度: <span id="sensitivity-value">1.0</span></label><br>
            <input type="range" id="sensitivity-slider" min="0.1" max="5.0" step="0.1" value="1.0" style="width: 200px; pointer-events: auto;">
        </div>
    </div>

    <div id="game-over-screen">
        <h1 style="font-size: 64px; margin-bottom: 10px; font-family: serif;">YOU DIED</h1>
        <h2 style="font-size: 32px; color: #f1c40f; margin-bottom: 20px;">FINAL SCORE: <span id="final-score-display">0</span></h2>
        
        <div>
            <input type="text" id="nickname-input" placeholder="Nickname (Max 10)" maxlength="10" style="padding: 10px; font-size: 18px; border-radius: 4px; border: none; outline: none; text-align: center;">
            <button id="submit-score-btn" onclick="submitScore()" class="shop-btn" style="width: auto; padding: 10px 20px; margin-left: 10px; background: #27ae60;">ランキングに登録</button>
        </div>

        <div id="leaderboard-box">
            <h3>GLOBAL RANKING</h3>
            <ul id="leaderboard-list">
                <li>読み込み中...</li>
            </ul>
            <button id="load-more-btn" onclick="fetchMoreLeaderboard()" class="shop-btn" style="display: none; padding: 5px 15px; margin-top: 10px; font-size: 14px;">更に表示</button>
        </div>

        <button onclick="restartGame()" class="shop-btn" style="width: auto; padding: 10px 30px; margin-top: 30px; background: #555;">もう一度プレイ</button>
    </div>

    <div id="ui-layer">
        <div id="damage-overlay"></div>
        <div id="crosshair">+</div>
        <div id="hud">
            <div>WAVE: <span id="wave-display" style="color: #e74c3c; font-weight: bold;">1</span></div>
            <div>SCORE: <span id="score-display" style="color: #f1c40f; font-weight: bold;">0</span></div>
            <div style="color: #2ecc71;">MONEY: $<span id="money-display">0</span></div>
            <div style="margin-top: 10px; font-size: 18px;">HP: <span id="hp-display">100</span> / 100</div>
            <div class="hud-bar-container"><div id="hp-bar" class="hud-bar"></div></div>
            <div style="margin-top: 10px; font-size: 18px;">AMMO: <span id="ammo-display">-- / --</span> <span id="reload-text" style="color: #e74c3c; font-weight: bold; display: none; margin-left: 10px;">RELOADING...</span></div>
            <div class="hud-bar-container"><div id="ammo-bar" class="hud-bar"></div></div>
            <div style="margin-top: 10px; font-size: 18px;">WEAPON: <span id="weapon-display">Pistol</span></div>
        </div>
        
        <div id="shop-screen">
            <h2 style="margin-top: 0; color: #f1c40f;">SHOP</h2>
            <p>所持金: $<span id="shop-money-display">0</span></p>
            <button class="shop-btn" onclick="buyWeapon('SMG', 500)">MAC-10 SMG ($500)</button>
            <button class="shop-btn" onclick="buyWeapon('Assault Rifle', 1500)">AK-47 ($1500)</button>
            <hr style="border-color: #444; margin: 20px 0;">
            <button class="shop-btn" style="background: #e74c3c;" onclick="closeShop()">閉じる</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- Supabase 初期化 ---
        // ※以下のURLとKEYを自分のSupabaseプロジェクトのものに書き換えてください
        const SUPABASE_URL = 'https://wruyddcigpisuqeorems.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndydXlkZGNpZ3Bpc3VxZW9yZW1zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExODM2MzcsImV4cCI6MjA5Njc1OTYzN30.qEZg0bMMg0LLxNKXE4O94nnhe_2URTDlEG3YMxxpGT0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- Web Audio API (プロシージャルサウンド) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        const bufferSize = audioCtx.sampleRate * 1.0;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

        function playGunSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = noiseBuffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            const gainNode = audioCtx.createGain();
            noiseSource.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            let decay = 0.1;
            if(type === 'Pistol') { filter.frequency.value = 1500; decay = 0.2; }
            if(type === 'SMG') { filter.frequency.value = 2500; decay = 0.15; }
            if(type === 'Assault Rifle') { filter.frequency.value = 1000; decay = 0.3; }

            gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + decay);

            noiseSource.start();
            noiseSource.stop(audioCtx.currentTime + decay);
        }

        function playReloadSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            for (let i = 0; i < 2; i++) {
                const noiseSource = audioCtx.createBufferSource();
                noiseSource.buffer = noiseBuffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass'; 
                filter.frequency.value = 2000 + i * 500;
                filter.Q.value = 5;
                const gainNode = audioCtx.createGain();
                noiseSource.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                const startTime = audioCtx.currentTime + i * 0.15; 
                const decay = 0.05;
                gainNode.gain.setValueAtTime(0, startTime);
                gainNode.gain.linearRampToValueAtTime(1.0, startTime + 0.005); 
                gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + decay);

                noiseSource.start(startTime);
                noiseSource.stop(startTime + decay);
            }
        }

        function playVomitSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const t = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, t);
            osc.frequency.exponentialRampToValueAtTime(80, t + 0.5);

            const formantFilter = audioCtx.createBiquadFilter();
            formantFilter.type = 'bandpass';
            formantFilter.Q.value = 4.0;
            formantFilter.frequency.setValueAtTime(400, t);
            formantFilter.frequency.exponentialRampToValueAtTime(1500, t + 0.3);

            const noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = noiseBuffer;
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.setValueAtTime(600, t);
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.5, t);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
            noiseSource.connect(noiseFilter).connect(noiseGain);

            const mainGain = audioCtx.createGain();
            mainGain.gain.setValueAtTime(0, t);
            mainGain.gain.linearRampToValueAtTime(1.2, t + 0.05);
            mainGain.gain.exponentialRampToValueAtTime(0.2, t + 0.15);
            mainGain.gain.linearRampToValueAtTime(1.5, t + 0.25);
            mainGain.gain.exponentialRampToValueAtTime(0.01, t + 0.6);

            osc.connect(formantFilter).connect(mainGain);
            noiseGain.connect(mainGain);
            mainGain.connect(audioCtx.destination);

            osc.start(t);
            osc.stop(t + 0.6);
            noiseSource.start(t);
            noiseSource.stop(t + 0.6);
        }

        // --- MouseMoveControls ---
        class MouseMoveControls {
            constructor(camera, domElement) {
                this.camera = camera;
                this.domElement = domElement;
                this.isLocked = false;
                this.sensitivity = 1.0;
                this._euler = new THREE.Euler(0, 0, 0, 'YXZ');
                this._PI_2 = Math.PI / 2;
                this._onMouseMove = this.onMouseMove.bind(this);
                this._onPointerlockChange = this.onPointerlockChange.bind(this);
                this.connect();
            }
            connect() {
                document.addEventListener('mousemove', this._onMouseMove);
                document.addEventListener('pointerlockchange', this._onPointerlockChange);
            }
            onMouseMove(event) {
                if (!this.isLocked) return;
                const movementX = event.movementX || 0;
                const movementY = event.movementY || 0;
                this._euler.setFromQuaternion(this.camera.quaternion);
                this._euler.y -= movementX * 0.002 * this.sensitivity;
                this._euler.x -= movementY * 0.002 * this.sensitivity;
                this._euler.x = Math.max(-this._PI_2, Math.min(this._PI_2, this._euler.x));
                this.camera.quaternion.setFromEuler(this._euler);
            }
            onPointerlockChange() {
                if (document.pointerLockElement === this.domElement) {
                    this.isLocked = true;
                    document.getElementById('start-screen').style.display = 'none';
                    document.getElementById('game-over-screen').style.display = 'none';
                } else {
                    this.isLocked = false;
                    if (!isGameOver && !isShopOpen) document.getElementById('start-screen').style.display = 'flex';
                }
            }
            lock() { this.domElement.requestPointerLock(); }
            unlock() { document.exitPointerLock(); }
        }

        // --- ゲーム変数の初期化 ---
        let score = 0;
        let money = 0; let wave = 1; let zombiesToKill = 5; let currentWeapon = 'Pistol';
        let zombies = []; let bullets = []; let vomits = []; let isShopOpen = false;
        let isReloading = false; let currentAmmo = 0; let reloadTimeout = null;
        let playerHp = 100; let playerMaxHp = 100;
        let isRunning = false; let isGameOver = false;
        let bloodParticles = [];

        let obstacles = [];
        let obstacleMeshes = [];

        const weapons = {
            'Pistol': { isAuto: false, fireRate: 0, damage: 34, recoil: 0.1, magSize: 10, reloadTime: 1500, spreadFactor: 0.01 },
            'SMG': { isAuto: true, fireRate: 80, damage: 20, recoil: 0.05, magSize: 30, reloadTime: 2000, spreadFactor: 0.008 },
            'Assault Rifle': { isAuto: true, fireRate: 110, damage: 45, recoil: 0.15, magSize: 30, reloadTime: 2500, spreadFactor: 0.012 }
        };

        // --- Three.js セットアップ ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020202);
        scene.fog = new THREE.FogExp2(0x000000, 0.03); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 1.6;
        scene.add(camera);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2); 
        scene.add(ambientLight);

        const mapSize = 60;
        const mapLimit = mapSize / 2;
        const roomHeight = 12;

        const floorGeo = new THREE.PlaneGeometry(mapSize, mapSize);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x2a1610, roughness: 0.7 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const ceilingGeo = new THREE.PlaneGeometry(mapSize, mapSize);
        const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
        const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = roomHeight;
        scene.add(ceiling);

        const wallThickness = 2;
        const wallGeoX = new THREE.BoxGeometry(mapSize + wallThickness * 2, roomHeight, wallThickness);
        const wallGeoZ = new THREE.BoxGeometry(wallThickness, roomHeight, mapSize);
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x3d0c11, roughness: 0.9 });

        const wallNorth = new THREE.Mesh(wallGeoX, wallMat);
        wallNorth.position.set(0, roomHeight / 2, -mapLimit - wallThickness / 2);
        const wallSouth = new THREE.Mesh(wallGeoX, wallMat);
        wallSouth.position.set(0, roomHeight / 2, mapLimit + wallThickness / 2);
        const wallEast = new THREE.Mesh(wallGeoZ, wallMat);
        wallEast.position.set(mapLimit + wallThickness / 2, roomHeight / 2, 0);
        const wallWest = new THREE.Mesh(wallGeoZ, wallMat);
        wallWest.position.set(-mapLimit - wallThickness / 2, roomHeight / 2, 0);
        scene.add(wallNorth, wallSouth, wallEast, wallWest);

        const pillarGeo = new THREE.BoxGeometry(2, roomHeight, 2);
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x2a1610, roughness: 0.8 });

        for (let x = -20; x <= 20; x += 20) {
            for (let z = -20; z <= 20; z += 20) {
                if (x === 0 && z === 0) continue; 
                const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                pillar.position.set(x, roomHeight / 2, z);
                scene.add(pillar);
                
                obstacles.push({ mesh: pillar, radius: 1.5 });
                obstacleMeshes.push(pillar);

                const light = new THREE.PointLight(0xffaa00, 1.2, 30);
                light.position.set(x, roomHeight - 2, z);
                scene.add(light);
            }
        }

        const crateGeo = new THREE.BoxGeometry(4, 4, 4);
        const crateMat = new THREE.MeshStandardMaterial({ color: 0x4a2e15, roughness: 1.0 });
        for(let i=0; i<10; i++) {
            const crate = new THREE.Mesh(crateGeo, crateMat);
            crate.position.set((Math.random() - 0.5) * 50, 2, (Math.random() - 0.5) * 50);
            
            if(crate.position.distanceTo(new THREE.Vector3(0,0,0)) > 8) {
                scene.add(crate);
                obstacles.push({ mesh: crate, radius: 2.5 }); 
                obstacleMeshes.push(crate);
            }
        }

        const gunGroup = new THREE.Group();
        gunGroup.position.set(0.3, -0.25, -0.5);
        gunGroup.userData = { originalPosition: gunGroup.position.clone() }; 
        camera.add(gunGroup);

        const muzzleLight = new THREE.PointLight(0xffaa00, 0, 5);
        gunGroup.add(muzzleLight);

        const gunMats = {
            metal: new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8, roughness: 0.2 }),
            darkMetal: new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.9, roughness: 0.3 }),
            wood: new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.9 })
        };

        function updateWeaponModel() {
            for(let i = gunGroup.children.length - 1; i >= 0; i--) {
                if(gunGroup.children[i].type !== 'PointLight') gunGroup.remove(gunGroup.children[i]);
            }
            if (currentWeapon === 'Pistol') {
                const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.4), gunMats.metal);
                barrel.position.set(0, 0, -0.1);
                const grip = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.2, 0.1), gunMats.metal);
                grip.position.set(0, -0.1, 0.05); grip.rotation.x = 0.2;
                gunGroup.add(barrel, grip);
                muzzleLight.position.set(0, 0, -0.3);
            } 
            else if (currentWeapon === 'SMG') {
                const receiver = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.18, 0.35), gunMats.darkMetal);
                receiver.position.set(0, 0, -0.05);
                const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.15), gunMats.darkMetal);
                barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0.05, -0.25);
                const mag = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.25, 0.1), gunMats.darkMetal);
                mag.position.set(0, -0.15, -0.05);
                gunGroup.add(receiver, barrel, mag);
                muzzleLight.position.set(0, 0.05, -0.35);
            } 
            else if (currentWeapon === 'Assault Rifle') {
                const receiver = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.4), gunMats.darkMetal);
                receiver.position.set(0, 0, -0.1);
                const stock = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.15, 0.3), gunMats.wood);
                stock.position.set(0, -0.05, 0.25); stock.rotation.x = -0.1;
                const handguard = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.1, 0.25), gunMats.wood);
                handguard.position.set(0, 0, -0.3);
                const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.4), gunMats.darkMetal);
                barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0.02, -0.5);
                const mag = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.3, 0.12), gunMats.darkMetal);
                mag.position.set(0, -0.15, -0.2); mag.rotation.x = 0.2;
                const grip = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.15, 0.08), gunMats.wood);
                grip.position.set(0, -0.12, 0); grip.rotation.x = 0.2;
                gunGroup.add(receiver, stock, handguard, barrel, mag, grip);
                muzzleLight.position.set(0, 0.02, -0.75);
            }
        }
        updateWeaponModel();

        function createZombieTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#6b7a6b'; ctx.fillRect(0, 0, 256, 256);
            for(let i = 0; i < 50; i++) {
                ctx.fillStyle = Math.random() > 0.3 ? '#300000' : '#111';
                ctx.beginPath();
                ctx.arc(Math.random()*256, Math.random()*256, Math.random()*15, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.fillStyle = '#000';
            ctx.fillRect(60, 60, 40, 30); ctx.fillRect(156, 60, 40, 30);
            ctx.fillStyle = '#400000';
            ctx.fillRect(80, 160, 96, 40);
            return new THREE.CanvasTexture(canvas);
        }
        const zombieMat = new THREE.MeshStandardMaterial({ map: createZombieTexture(), roughness: 1.0 });

        function spawnZombies(count) {
            const zombieHp = 100 + (wave - 1) * 20;
            for (let i = 0; i < count; i++) {
                const zombieGroup = new THREE.Group();
                const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1.4, 0.5), zombieMat);
                body.position.y = 0.7;
                const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), zombieMat);
                head.position.y = 1.7;
                zombieGroup.add(body, head);

                const angle = Math.random() * Math.PI * 2;
                const radius = 15 + Math.random() * 10;
                let spawnX = camera.position.x + Math.cos(angle) * radius;
                let spawnZ = camera.position.z + Math.sin(angle) * radius;
                
                spawnX = Math.max(-mapLimit + 2, Math.min(mapLimit - 2, spawnX));
                spawnZ = Math.max(-mapLimit + 2, Math.min(mapLimit - 2, spawnZ));

                zombieGroup.position.set(spawnX, 0, spawnZ);
                scene.add(zombieGroup);
                
                const randomVomitDelay = Math.random() * 30000;
                
                zombieGroup.userData = { 
                    isZombie: true, 
                    root: zombieGroup, 
                    hp: zombieHp, 
                    nextVomitTime: performance.now() + randomVomitDelay
                };
                body.userData = zombieGroup.userData; head.userData = zombieGroup.userData;
                zombies.push(body, head); 
            }
        }
        spawnZombies(zombiesToKill);

        function createParticleTexture(colorHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = colorHex;
            ctx.beginPath();
            ctx.arc(16, 16, 14, 0, Math.PI * 2);
            ctx.fill();
            return new THREE.CanvasTexture(canvas);
        }
        const bloodMat = new THREE.SpriteMaterial({ map: createParticleTexture('#8a0303'), color: 0xffffff, transparent: true, opacity: 1.0 });
        const vomitProjectilMat = new THREE.MeshBasicMaterial({ color: 0x39ff14 }); 
        const vomitGeo = new THREE.SphereGeometry(0.3, 8, 8);

        const controls = new MouseMoveControls(camera, document.body);
        
        document.getElementById('start-button').addEventListener('click', () => {
            if (isGameOver) { restartGame(); return; }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            controls.lock(); 
        });

        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let moveState = { forward: false, backward: false, left: false, right: false };
        let canJump = false;
        let prevTime = performance.now();
        let isMouseDown = false;
        let lastShootTime = 0;

        document.addEventListener('keydown', (e) => {
            if(e.code === 'KeyW') moveState.forward = true;
            if(e.code === 'KeyS') moveState.backward = true;
            if(e.code === 'KeyA') moveState.left = true;
            if(e.code === 'KeyD') moveState.right = true;
            if(e.code === 'KeyB') toggleShop();
            if(e.code === 'KeyR') reload();
            if(e.code === 'ShiftLeft') isRunning = true;
            if(e.code === 'Space' && canJump && controls.isLocked && !isShopOpen) { velocity.y += 10; canJump = false; }
            
            if(e.code === 'KeyO' && controls.isLocked) {
                money += 10000;
                document.getElementById('money-display').innerText = money;
            }
            if(e.code === 'KeyP' && controls.isLocked && !isGameOver) {
                const uniqueZombies = [...new Set(zombies.map(z => z.userData.root))];
                uniqueZombies.forEach(z => scene.remove(z));
                zombies = [];
                updatePlayerHP(50); 
                wave++;
                document.getElementById('wave-display').innerText = wave;
                zombiesToKill += 3;
                setTimeout(() => spawnZombies(zombiesToKill), 1000);
            }
        });
        document.addEventListener('keyup', (e) => {
            if(e.code === 'KeyW') moveState.forward = false;
            if(e.code === 'KeyS') moveState.backward = false;
            if(e.code === 'KeyA') moveState.left = false;
            if(e.code === 'KeyD') moveState.right = false;
            if(e.code === 'ShiftLeft') isRunning = false;
        });

        const sensitivitySlider = document.getElementById('sensitivity-slider');
        sensitivitySlider.addEventListener('input', () => {
            controls.sensitivity = parseFloat(sensitivitySlider.value);
            document.getElementById('sensitivity-value').innerText = controls.sensitivity.toFixed(1);
        });

        const raycaster = new THREE.Raycaster();
        const ammoDisplay = document.getElementById('ammo-display');
        const ammoBar = document.getElementById('ammo-bar');
        const reloadText = document.getElementById('reload-text');

        function updateAmmoUI() {
            const spec = weapons[currentWeapon];
            ammoDisplay.innerText = currentAmmo + " / " + spec.magSize;
            ammoBar.style.width = (currentAmmo / spec.magSize * 100) + "%";
        }
        currentAmmo = weapons[currentWeapon].magSize; 
        updateAmmoUI();

        function reload() {
            const spec = weapons[currentWeapon];
            if (isReloading || isShopOpen || currentAmmo === spec.magSize || !controls.isLocked) return;
            playReloadSound();
            isReloading = true;
            reloadText.style.display = 'inline';
            gunGroup.position.z += 0.1; 
            reloadTimeout = setTimeout(() => {
                currentAmmo = spec.magSize;
                updateAmmoUI();
                isReloading = false;
                reloadText.style.display = 'none';
                gunGroup.position.z -= 0.1; 
            }, spec.reloadTime);
        }
        
        function shoot() {
            if (!controls.isLocked || isShopOpen || isReloading || currentAmmo <= 0) return;
            const weaponSpec = weapons[currentWeapon];
            currentAmmo--;
            updateAmmoUI();
            playGunSound(currentWeapon);
            if (currentAmmo <= 0) reload(); 

            muzzleLight.intensity = 2;
            gunGroup.position.z += weaponSpec.recoil; 
            gunGroup.rotation.x += weaponSpec.recoil * 1.5;
            setTimeout(() => { muzzleLight.intensity = 0; }, 40);

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const moveSpeed = new THREE.Vector3(velocity.x, 0, velocity.z).length();
            let spread = weaponSpec.spreadFactor * (1 + moveSpeed * 0.1);
            if (isRunning) spread *= 2.5; 

            const offset = new THREE.Vector3((Math.random() - 0.5) * spread, (Math.random() - 0.5) * spread, (Math.random() - 0.5) * spread);
            raycaster.ray.direction.add(offset).normalize();

            const gunTipPos = new THREE.Vector3();
            muzzleLight.getWorldPosition(gunTipPos);

            let hitPoint = raycaster.ray.at(50, new THREE.Vector3()); 
            
            const shootables = [...zombies, ...obstacleMeshes];
            const intersects = raycaster.intersectObjects(shootables);
            
            if (intersects.length > 0) {
                hitPoint = intersects[0].point; 
                const hitObject = intersects[0].object;
                
                if(hitObject.userData && hitObject.userData.isZombie) {
                    const rootZombie = hitObject.userData.root;
                    if(scene.children.includes(rootZombie)) {
                        rootZombie.userData.hp -= weaponSpec.damage;
                        spawnBloodEffect(hitPoint);

                        if (rootZombie.userData.hp <= 0) {
                            scene.remove(rootZombie);
                            zombies = zombies.filter(z => z.userData.root !== rootZombie);
                            
                            money += 10 + (wave * 2);
                            score += 100 * wave; 
                            document.getElementById('money-display').innerText = money;
                            document.getElementById('score-display').innerText = score;

                            if (zombies.length === 0) {
                                updatePlayerHP(50); 
                                wave++;
                                document.getElementById('wave-display').innerText = wave;
                                zombiesToKill += 3;
                                setTimeout(() => spawnZombies(zombiesToKill), 2000);
                            }
                        }
                    }
                }
            }

            const bulletGeo = new THREE.BufferGeometry().setFromPoints([gunTipPos, hitPoint]);
            const bulletMat = new THREE.LineBasicMaterial({ color: 0xffffaa, transparent: true, opacity: 1, linewidth: (currentWeapon === 'Assault Rifle' ? 2 : 1) });
            const bulletLine = new THREE.Line(bulletGeo, bulletMat);
            scene.add(bulletLine);
            bullets.push({ mesh: bulletLine, life: 1.0 });
        }

        function spawnBloodEffect(point) {
            for (let i = 0; i < 6; i++) {
                const particle = new THREE.Sprite(bloodMat.clone());
                particle.position.copy(point);
                const scale = 0.05 + Math.random() * 0.1;
                particle.scale.set(scale, scale, scale);
                scene.add(particle);

                const speed = 2 + Math.random() * 3;
                const vel = new THREE.Vector3((Math.random() - 0.5), (Math.random() - 0.2), (Math.random() - 0.5)).normalize().multiplyScalar(speed * 0.016); 
                bloodParticles.push({ sprite: particle, velocity: vel, life: 1.0, gravity: -0.01 });
            }
        }

        document.addEventListener('mousedown', (e) => { 
            if (e.button === 0 && controls.isLocked && !isShopOpen) {
                isMouseDown = true;
                if (!weapons[currentWeapon].isAuto) shoot();
            }
        });
        document.addEventListener('mouseup', (e) => { if (e.button === 0) isMouseDown = false; });

        function toggleShop() {
            if (isShopOpen) closeShop();
            else {
                if (isReloading || isGameOver) return;
                isMouseDown = false;
                controls.unlock(); isShopOpen = true;
                document.getElementById('shop-screen').style.display = 'block';
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('shop-money-display').innerText = money;
            }
        }
        window.buyWeapon = function(name, price) {
            if (money >= price) {
                money -= price;
                document.getElementById('money-display').innerText = money;
                document.getElementById('shop-money-display').innerText = money;
                currentWeapon = name;
                document.getElementById('weapon-display').innerText = currentWeapon;
                updateWeaponModel();
                currentAmmo = weapons[currentWeapon].magSize; 
                updateAmmoUI();
            }
        }
        window.closeShop = function() {
            isShopOpen = false;
            document.getElementById('shop-screen').style.display = 'none';
            controls.lock();
        }

        const hpDisplay = document.getElementById('hp-display');
        const hpBar = document.getElementById('hp-bar');
        const damageOverlay = document.getElementById('damage-overlay');

        function updatePlayerHP(amount) {
            if (isGameOver) return;
            playerHp += amount;
            
            if (amount < 0) {
                damageOverlay.style.opacity = 1;
                setTimeout(() => { damageOverlay.style.opacity = 0; }, 150);
            }

            if (playerHp > playerMaxHp) playerHp = playerMaxHp;
            if (playerHp <= 0) { playerHp = 0; gameOver(); }
            hpDisplay.innerText = Math.floor(playerHp); 
            hpBar.style.width = (playerHp / playerMaxHp * 100) + "%";
        }

        // --- ゲームオーバー＆ランキング処理 ---
        function gameOver() {
            isGameOver = true;
            controls.unlock();
            
            const gameOverScreen = document.getElementById('game-over-screen');
            gameOverScreen.style.display = 'flex';
            document.getElementById('final-score-display').innerText = score;
            
            clearTimeout(reloadTimeout);
            isReloading = false;
            reloadText.style.display = 'none';

            fetchLeaderboard(10); // 初期表示は10件
        }

        async function registerScore() {
            if (score <= 0) {
                alert("スコアが0のため登録できません。");
                return;
            }

            const nameInput = document.getElementById('nickname-input');
            const nickname = nameInput.value.trim();
            
            // バリデーション（未入力チェック）
            if (!nickname) {
                alert("ニックネームを入力してください。");
                return;
            }

            // 二重送信防止（ボタンを非活性にする）
            const submitBtn = document.getElementById('submit-score-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = "登録中...";

            const { data, error } = await supabaseClient
                .from('leaderboard')
                .insert([{ name: nickname, score: score }]);

            if (error) {
                console.error("Insert Error:", error);
                alert("登録に失敗しました。設定を確認してください。");
                // 失敗した場合はボタンを再度有効にする
                submitBtn.disabled = false;
                submitBtn.innerText = "ランキングに登録";
            } else {
                alert("ランキングに登録しました！");
                nameInput.disabled = true;
                submitBtn.innerText = "登録完了";
                fetchLeaderboard(10); // ランキングを再取得して表示を更新
            }
        }

        window.submitScore = registerScore; 

        // 更に表示ボタンの処理
        window.fetchMoreLeaderboard = function() {
            fetchLeaderboard(500); // 500件取得
        }

        async function fetchLeaderboard(limitValue) {
            const list = document.getElementById('leaderboard-list');
            const loadMoreBtn = document.getElementById('load-more-btn');
            
            if(limitValue === 10) list.innerHTML = '<li>読み込み中...</li>';

            const { data, error } = await supabaseClient
                .from('leaderboard')
                .select('*')
                .order('score', { ascending: false })
                .limit(limitValue);

            if (error) {
                console.error("Fetch Error:", error);
                list.innerHTML = '<li>ランキングの取得に失敗しました。</li>';
                return;
            }

            list.innerHTML = '';
            if (data.length === 0) {
                list.innerHTML = '<li>まだ記録がありません。</li>';
            } else {
                data.forEach((entry, index) => {
                    const li = document.createElement('li');
                    li.innerHTML = `<span>#${index + 1} ${entry.name}</span> <span>${entry.score} pts</span>`;
                    list.appendChild(li);
                });
            }

            // トップ10表示で、かつデータが10件以上（続きがありそう）なら「更に表示」ボタンを出す
            if (limitValue === 10 && data.length >= 10) {
                loadMoreBtn.style.display = 'block';
            } else {
                // トップ500表示時、またはデータが10件未満ならボタンを隠す
                loadMoreBtn.style.display = 'none';
            }
        }

        function restartGame() { location.reload(); }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (isMouseDown && weapons[currentWeapon].isAuto && controls.isLocked && !isReloading) {
                if (time - lastShootTime > weapons[currentWeapon].fireRate) {
                    shoot(); lastShootTime = time;
                }
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].life -= delta * 15;
                if (bullets[i].life <= 0) { scene.remove(bullets[i].mesh); bullets.splice(i, 1); } 
                else { bullets[i].mesh.material.opacity = bullets[i].life; }
            }

            for (let i = bloodParticles.length - 1; i >= 0; i--) {
                const p = bloodParticles[i];
                p.life -= delta; 
                if (p.life <= 0) { scene.remove(p.sprite); bloodParticles.splice(i, 1); } 
                else {
                    p.velocity.y += p.gravity * delta * 60; 
                    p.sprite.position.add(p.velocity);
                    p.sprite.material.opacity = p.life;
                }
            }

            for (let i = vomits.length - 1; i >= 0; i--) {
                const v = vomits[i];
                v.life -= delta;
                v.mesh.position.addScaledVector(v.dir, 10 * delta); 
                
                if (v.mesh.position.distanceTo(camera.position) < 1.2) {
                    updatePlayerHP(-15); 
                    scene.remove(v.mesh);
                    vomits.splice(i, 1);
                } else if (v.life <= 0 || v.mesh.position.y < 0) {
                    scene.remove(v.mesh);
                    vomits.splice(i, 1);
                }
            }

            if (!isReloading) {
                gunGroup.position.x = THREE.MathUtils.lerp(gunGroup.position.x, gunGroup.userData.originalPosition.x, 0.1);
                gunGroup.position.y = THREE.MathUtils.lerp(gunGroup.position.y, gunGroup.userData.originalPosition.y, 0.1);
                gunGroup.position.z = THREE.MathUtils.lerp(gunGroup.position.z, gunGroup.userData.originalPosition.z, 0.1);
                gunGroup.rotation.x = THREE.MathUtils.lerp(gunGroup.rotation.x, 0, 0.1);
            }

            if (controls.isLocked && !isGameOver) {
                velocity.y -= 30.0 * delta; 
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveState.forward) - Number(moveState.backward);
                direction.x = Number(moveState.left) - Number(moveState.right); 
                direction.normalize(); 

                const baseSpeed = 25.0; 
                let playerSpeed = baseSpeed;
                if (isRunning) playerSpeed *= 1.6;
                if (isReloading || (isRunning && isReloading)) playerSpeed = baseSpeed;

                if (moveState.forward || moveState.backward) velocity.z -= direction.z * playerSpeed * delta;
                if (moveState.left || moveState.right) velocity.x -= direction.x * playerSpeed * delta;

                controls.camera.translateX(velocity.x * delta);
                controls.camera.translateZ(velocity.z * delta);
                controls.camera.position.y += velocity.y * delta;

                obstacles.forEach(obs => {
                    let dx = camera.position.x - obs.mesh.position.x;
                    let dz = camera.position.z - obs.mesh.position.z;
                    let distSq = dx * dx + dz * dz;
                    let minRadius = obs.radius + 1.0; 
                    
                    if (distSq < minRadius * minRadius && distSq > 0) {
                        let dist = Math.sqrt(distSq);
                        let overlap = minRadius - dist;
                        camera.position.x += (dx / dist) * overlap;
                        camera.position.z += (dz / dist) * overlap;
                    }
                });

                const playerLimit = mapLimit - 2; 
                if (camera.position.x > playerLimit) camera.position.x = playerLimit;
                if (camera.position.x < -playerLimit) camera.position.x = -playerLimit;
                if (camera.position.z > playerLimit) camera.position.z = playerLimit;
                if (camera.position.z < -playerLimit) camera.position.z = -playerLimit;

                if (camera.position.y < 1.6) {
                    velocity.y = 0; camera.position.y = 1.6; canJump = true;
                }

                const uniqueZombies = [...new Set(zombies.map(z => z.userData.root))];
                
                for (let i = 0; i < uniqueZombies.length; i++) {
                    for (let j = i + 1; j < uniqueZombies.length; j++) {
                        const z1 = uniqueZombies[i];
                        const z2 = uniqueZombies[j];
                        const distSq = z1.position.distanceToSquared(z2.position);
                        const minRadius = 1.5; 
                        if (distSq < minRadius * minRadius && distSq > 0) {
                            const dist = Math.sqrt(distSq);
                            const pushDir = new THREE.Vector3().subVectors(z1.position, z2.position).normalize();
                            const overlap = (minRadius - dist) * 0.5; 
                            z1.position.addScaledVector(pushDir, overlap);
                            z2.position.addScaledVector(pushDir, -overlap);
                        }
                    }
                }

                uniqueZombies.forEach(zombie => {
                    const distance = camera.position.distanceTo(zombie.position);
                    
                    if (wave >= 5 && time > zombie.userData.nextVomitTime && distance > 5 && distance < 20) {
                        const vomit = new THREE.Mesh(vomitGeo, vomitProjectilMat);
                        vomit.position.copy(zombie.position);
                        vomit.position.y = 1.5; 
                        
                        const vDir = new THREE.Vector3().subVectors(camera.position, vomit.position);
                        vDir.y -= 0.5; 
                        vDir.normalize();
                        
                        scene.add(vomit);
                        vomits.push({ mesh: vomit, dir: vDir, life: 4.0 });
                        
                        playVomitSound();
                        
                        zombie.userData.nextVomitTime = time + 25000 + Math.random() * 10000;
                    }

                    const zombieBaseSpeed = 2;
                    const zombieSpeed = zombieBaseSpeed + (wave - 1) * 0.2; 
                    
                    if (distance < 1.8) { 
                        updatePlayerHP(-20 * delta); 
                    }

                    const directionToPlayer = new THREE.Vector3();
                    directionToPlayer.subVectors(camera.position, zombie.position);
                    directionToPlayer.y = 0; 
                    directionToPlayer.normalize();
                    zombie.position.addScaledVector(directionToPlayer, zombieSpeed * delta);
                    zombie.lookAt(camera.position.x, zombie.position.y, camera.position.z);
                    
                    obstacles.forEach(obs => {
                        let dx = zombie.position.x - obs.mesh.position.x;
                        let dz = zombie.position.z - obs.mesh.position.z;
                        let distSq = dx * dx + dz * dz;
                        let minRadius = obs.radius + 1.0; 
                        if (distSq < minRadius * minRadius && distSq > 0) {
                            let dist = Math.sqrt(distSq);
                            let overlap = minRadius - dist;
                            zombie.position.x += (dx / dist) * overlap;
                            zombie.position.z += (dz / dist) * overlap;
                        }
                    });

                    if (zombie.position.x > playerLimit) zombie.position.x = playerLimit;
                    if (zombie.position.x < -playerLimit) zombie.position.x = -playerLimit;
                    if (zombie.position.z > playerLimit) zombie.position.z = playerLimit;
                    if (zombie.position.z < -playerLimit) zombie.position.z = -playerLimit;
                });
            }

            renderer.render(scene, camera);
            prevTime = time;
        }

        animate();
    </script>
</body>
</html>
